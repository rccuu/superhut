acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: 此前未选择「不再提示」时，点击校园卡余额卡片中的「前往充值」，先弹出充值提示框而不直接跳转。"
    result: passed
    reason:
      text: view.dart:401-405 _launchUrl 先 await _shouldShowRechargeTip()（443-454，读
        user_page_recharge_tip_dismissed，未选默认 true），为真先 showRechargeTipDialog
        再决定跳转；测试 'recharge tip dialog shows before opening when not dismissed'
        断言点击后 openCalls==0 且弹框出现。Verifier 独立复跑 flutter test
        test/home/userpage_test.dart 全部 15 项通过。
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: 提示框内容完整说明 ①前往支付宝小程序充值 ②登录密码为身份证后 6 位 ③充值入口在小程序左上角、返回键右边
      ④进入充值页面若出现「出现异常，请联系运维人员」提示没有影响、实际可到账、可先充 1 元试用。"
    result: passed
    reason:
      text: recharge_tip_dialog.dart 标题 L40「前往支付宝小程序充值」覆盖①；L52「登录密码是每个人身份证后 6
        位。」覆盖②；L54-56「充值入口在小程序的左上角，返回键的右边。」覆盖③；L58-61「出现异常，请联系运维人员…实际测试可以到账…可以先充
        1 块钱试一下」覆盖④。测试断言四个 find.textContaining（身份证后 6 位/左上角/出现异常，请联系运维人员/先充 1
        块钱）均 findsOneWidget。
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: 点击「知道了」关闭提示框并跳转支付宝小程序；下次点击「前往充值」仍先弹出提示框。"
    result: passed
    reason:
      text: recharge_tip_dialog.dart:71-76「知道了」pop(acknowledged)；view.dart:406-413
        action!=null 即继续跳转，仅 noMoreTip 写偏好，故 acknowledged 不写偏好下次仍弹框。测试断言点「知道了」后
        openCalls==1，再次点击「前往充值」弹框重现、openCalls 最终为 2。
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: 点击「不再提示」关闭提示框并跳转支付宝小程序；该选择持久保存（应用重启后仍生效），此后点击「前往充值」直接跳转、不再弹框。"
    result: passed
    reason:
      text: recharge_tip_dialog.dart:65-70「不再提示」pop(noMoreTip)；view.dart:409-412 写
        prefs.setBool(user_page_recharge_tip_dismissed,true) 后仍照常执行 L415-417
        跳转。测试 'recharge tip no-more-tip choice persists and skips dialog' 断言
        stored.getBool(...) isTrue，且用同一 mock
        偏好重建页面实例（模拟重启）后点击直接跳转（openCalls==1、弹框 findsNothing）。偏好每次点击时从
        SharedPreferences 读取，重启后仍生效。
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: 未点击任一按钮、通过点遮罩或系统返回关闭提示框时，不跳转支付宝小程序；下次点击「前往充值」仍先弹出提示框。"
    result: passed
    reason:
      text: 代码级证据（该场景无专门 widget 用例，按验收说明读实现）：showDialog 默认
        barrierDismissible=true，点遮罩或系统返回均以 null 值完成；view.dart:406-408 `if
        (action == null || !mounted) return;` 直接返回，不执行跳转、不写偏好，finally
        仅复位防连点标志；_shouldShowRechargeTip 未被持久化改变，下次点击 A1 同一路径仍先弹框。
      truncated: false
