    reason:
      text: "实现：logic.dart:331-360 `_applyDefaultDeviceSelection` 按 poscode 在
        deviceList 中匹配 savedCode 并 `_assignChoiceDevice(index)`，命中时同时置
        `state.defaultDeviceCode = savedCode`；view.dart:421-435 由「当前选中设备号 ==
        defaultDeviceCode」算出 `isDefaultDevice` 传给
        HotWaterCurrentDeviceCard；water_page_widgets.dart:331-341 在
        isDefaultDevice 时渲染 _WaterCapsule(label: '默认', icon:
        star_rounded)。独立验证（在 /tmp 的仓库副本中新增只读核验用例，走真实
        SharedPreferencesHotWaterDevicePreferenceStore 与默认注入的
        FunctionHotWaterLogic，未改动被验仓库）：`flutter test
        test/pages/water/zz_verifier_widget_test.dart` 的 A1 用例通过——预置
        SharedPreferences 键 hot_water_default_device='200002'，getDeviceList() 后
        choiceDevice==1（选中二栋热水），渲染页面后 find.text('二栋热水') 与 find.text('默认') 均
        findsOneWidget，HotWaterCurrentDeviceCard.isDefaultDevice==true。存储键与饮水页
        'device_order'/'device_note_*' 无冲突（grep 确认）。"
      truncated: false
