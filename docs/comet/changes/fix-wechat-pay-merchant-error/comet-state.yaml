acceptance:
  - id: A1
    source: brief.md
    text: "Android 收银台 Referer：Android 平台上，WebView 内任何 http(s) 顶层导航目标为
      wx.tenpay.com（含其子域）时，取消原导航并以附加 Referer: https://ecardh5.17wanxiao.com/
      的请求重新加载该收银台页（详见 specs/campus-card/spec.md「Android 端微信 H5 收银台携带商户域名
      Referer」场景）。"
    result: pending
    reason: null
  - id: A2
    source: brief.md
    text: iOS 行为不变：非 Android 平台（iOS 等）对 wx.tenpay.com 导航保持现有行为：不附加任何请求头，WebView
      内直接放行（详见 spec「非 Android 平台收银台导航不变」场景）。
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: 其余导航不受影响：wx.tenpay.com 以外的 http/https 导航仍在 WebView 内直接放行且不附加头；外部
      scheme（weixin://、alipays://、掌银 scheme 等）仍被拦截并交由系统打开，打开失败时提示用户。
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: 决策逻辑可测：收银台 Referer 决策为纯函数并有单元测试覆盖：Android + wx.tenpay.com → 返回 Referer
      值；Android + 子域（如 a.wx.tenpay.com）→ 返回；Android + 其他域 → null；非 Android +
      wx.tenpay.com → null。
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: 静态检查：flutter analyze（限定本次改动文件范围）与相关 flutter
      test（test/campus_card_recharge_test.dart）通过。
    result: pending
    reason: null
  - id: A6
    source: brief.md
    text: Android 真机实测：Android 真机上从校园卡 H5
      选择微信支付，不再出现「商户配置错误，请联系商户解决」，能唤起微信进入支付页（需用户参与验证）。
    result: pending
    reason: null
